repository_type: pipeline

nf_core_version: 3.3.2

lint:
  files_unchanged:
    - .github/CONTRIBUTING.md
    - .github/PULL_REQUEST_TEMPLATE.md
    - .github/CONTRIBUTING.md
    - CODE_OF_CONDUCT.md
    - assets/nf-core-wasteflow2_logo_light.png
    - docs/images/nf-core-wasteflow2_logo_light.png
    - docs/images/nf-core-wasteflow2_logo_dark.png
    - .github/ISSUE_TEMPLATE/bug_report.yml
    - .github/CONTRIBUTING.md
    - .github/PULL_REQUEST_TEMPLATE.md
    - assets/email_template.txt
    - docs/README.md
    - .prettierignore
  nextflow_config: false
  nf_test_content: false
  multiqc_config:
    - report_comment
  files_exist:
    - conf/igenomes.config
    - conf/igenomes_ignored.config
    - conf/test.config
    - conf/test_full.config
    - .github/workflows/nf-test.yml
    - .github/actions/get-shards/action.yml
    - .github/actions/nf-test/action.yml
    - .github/workflows/branch.yml
    - .github/workflows/nf-test.yml
    - .github/actions/get-shards/action.yml
    - .github/actions/nf-test/action.yml
    - .github/workflows/linting_comment.yml
    - .github/workflows/linting.yml
    - CODE_OF_CONDUCT.md
    - assets/nf-core-wasteflow2_logo_light.png
    - docs/images/nf-core-wasteflow2_logo_light.png
    - docs/images/nf-core-wasteflow2_logo_dark.png
    - .github/ISSUE_TEMPLATE/config.yml
    - .github/workflows/awstest.yml
    - .github/workflows/awsfulltest.yml
    - .github/workflows/nf-test.yml
    - .github/actions/get-shards/action.yml
    - .github/actions/nf-test/action.yml
    - nf-test.config
    - tests/default.nf.test
  readme:
    - nextflow_badge
    - nfcore_template_badge

template:
  org: BCCDC-PHL
  name: wasteflow2
  description: Nextflow pipeline for pathogen surveillance in wastewater
  author: Zohaib Anwar
  version: 1.0.0dev
  force: true
  outdir: .
  skip_features:
    - github_badges
    - ci
    - test_config
    - nf-test
    - igenomes
    - seqera_platform
    - gpu
    - gitpod
    - codespaces
    - slackreport
  is_nfcore: false
