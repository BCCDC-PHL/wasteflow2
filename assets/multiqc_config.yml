report_comment: >
  This report has been generated by the <a href="https://github.com/BCCDC-PHL/WASTEFLOW2" target="_blank">nf-core/viralrecon</a>
  analysis pipeline.

run_modules:
  - fastqc
  - fastp
  - kraken
  - freyja

# Keep your working Freyja configuration
freyja:
  skip_empty_samples: false
  plot_type: 'bargraph'
  stacking: 'percent'
  use_legend: true
  hide_zero_cats: true
  cpswitch: true
  cpswitch_c_active: false
  cpswitch_counts_label: "Absolute Values"
  cpswitch_percent_label: "Relative Percentages"
  height: 400
  sort_samples: true

sp:
  fastqc:
    fn: "*_fastqc.zip"
  fastp:
    fn: "*.fastp.json"
  kraken:
    fn: "*.kraken2.report.txt"
  freyja:
    contents: "summarized"
    num_lines: 100
    shared: true

sample_names_rename:
  - ['_sars_cov2', '']
  - ['_rsv_a', '']  
  - ['_rsv_b', '']
  - ['_L001', '']

# Try controlling order through module_order sequence and explicit anchors
module_order:
  - fastqc:
      name: "PREPROCESS: FastQC (Raw Reads)"
      anchor: "fastqc"
      info: "Quality control metrics for raw sequencing reads before any processing."
  - fastp:
      name: "PREPROCESS: fastp (Adapter Trimming)"  
      anchor: "fastp"
      info: "Adapter trimming and quality filtering results using fastp."
  - kraken:
      name: "PREPROCESS: Kraken 2 (Taxonomic Classification)"
      anchor: "kraken"
      info: "Taxonomic classification of reads to identify potential contaminants and target organisms."
  - freyja:
      name: "VARIANTS: Freyja - SARS-CoV-2"
      anchor: "freyja_sars_cov2"
      info: "Relative lineage abundances from mixed SARS-CoV-2 samples using Freyja demix analysis."
      path_filters:
        - "*sars_cov2*"
  - freyja:
      name: "VARIANTS: Freyja - RSV-A"
      anchor: "freyja_rsv_a"
      info: "Relative lineage abundances from mixed RSV-A samples using Freyja demix analysis."
      path_filters:
        - "*rsv_a*"
  - freyja:
      name: "VARIANTS: Freyja - RSV-B"
      anchor: "freyja_rsv_b"
      info: "Relative lineage abundances from mixed RSV-B samples using Freyja demix analysis."
      path_filters:
        - "*rsv_b*"

# Remove report_section_order entirely - let module_order control it
# report_section_order: # REMOVED

# Force section ordering using before/after relationships
report_section_order:
  fastp:
    after: fastqc
  kraken:
    after: fastp
  freyja_sars_cov2:
    after: kraken
  freyja_rsv_a:
    after: freyja_sars_cov2
  freyja_rsv_b:
    after: freyja_rsv_a

custom_css: |
  .mqc-section-plot {
    min-height: 400px;
  }
  .plotly-graph-div {
    width: 100% !important;
  }

fastqc:
  config:
    read_count_multiplier: 0.000001
    read_count_prefix: 'M'
    read_count_desc: 'millions'

fastp:
  skip_trimming_failure_codes: true

kraken:
  top_n: 10s